<!DOCTYPE html>
<!-- Visite de chantier : de la visite à la soumission, puis au bon de travail -->
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Visite de chantier</title>
  <!-- Ce qui rend l'application installable sur l'écran d'accueil de l'iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chantier">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="entete">
    <button id="retour" class="retour" hidden aria-label="Retour">‹ Retour</button>
    <h1 id="titre">Visites de chantier</h1>
  </header>

  <!-- Le contenu de chaque écran est construit par app.js -->
  <main id="app"></main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
  </script>
</body>
</html>
